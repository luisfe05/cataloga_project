<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cataloga</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <!-- Navigation bar -->
    <nav id="nav-bar">
        <span class="app-title">Cataloga</span>
        <div class="nav-links">
            <a href="#" class="nav-link active" data-view="catalog">Catalog</a>
            <a href="#" class="nav-link" data-view="dashboard">Dashboard</a>
            <a href="#" class="nav-link" data-view="settings">Settings</a>
        </div>
    </nav>

    <!-- View containers: only one is visible at a time -->
    <main>
        <div id="view-catalog" class="view">

            <!-- Project header -->
            <section class="project-header">
                <div class="project-badge" id="project-badge"></div>
                <div>
                    <p class="project-label">Project</p>
                    <p class="project-name" id="project-name"></p>
                </div>
            </section>

            <!-- Tabs: all files or only the ones that need manual review -->
            <div class="tabs">
                <button class="tab active" data-status="">All Files</button>
                <button class="tab" data-status="Manual Review"
                        id="tab-review">Manual Review (0)</button>
            </div>

            <!-- Search and filters -->
            <div class="toolbar">
                <input type="search" id="search-input" placeholder="Search">
                <select id="filter-media-type">
                    <option value="">Media Type: All</option>
                    <option value="Press">Press</option>
                    <option value="Documents">Documents</option>
                    <option value="Photos">Photos</option>
                    <option value="Audio">Audio</option>
                    <option value="Video">Video</option>
                </select>
                <select id="filter-source">
                    <option value="">Source: All</option>
                </select>
            </div>

            <!-- Message shown when there is nothing to list -->
            <p class="empty-message hidden" id="catalog-message"></p>

            <!-- Catalog table, filled in by catalog.js -->
            <table class="catalog-table" id="catalog-table">
                <thead>
                    <tr>
                        <th>Original Filename</th>
                        <th>Filename</th>
                        <th>Media Type</th>
                        <th>Source</th>
                        <th>Date</th>
                        <th>Summary</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="catalog-body"></tbody>
            </table>
        </div>

        <div id="view-dashboard" class="view hidden"></div>
        <div id="view-settings" class="view hidden"></div>
    </main>

    <!-- Scripts loaded in dependency order -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/settings.js"></script>

</body>
</html>
